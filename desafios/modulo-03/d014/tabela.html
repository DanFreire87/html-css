<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table {
            width: 400px;            
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
        }

        th,td {            
            border: 1px solid black;
            height: 30px;
        }

        .cabecalho {
            background-color: rgb(100, 100, 100);
            color: white;
        }

        .media {
            text-align: left;
            padding: 3px;
            background-color: rgb(100, 100, 100);
            color: white;
        }

        .media-final {
            text-align: center;
            background-color: rgb(100, 100, 100);
            color: white;
        }

        .notas {
            text-align: center;
        } 
    </style>
</head>
<body>
    <table>
        <thead class="cabecalho">
            <tr>
                <th scope="col" rowspan="2n">Área</th>
                <th scope="col" rowspan="2n">Disciplinas</th>
                <th scope="colgroup" colspan="2n">Notas</th>
                <th scope="col" rowspan="2n">Média</th>
            </tr>
            <tr>
                <th scope="col">Notas 1</th>
                <th scope="col">Notas 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="4n">Exatas</th>
                <td>Matemática</td>
                <td class="notas">8.3</td>
                <td class="notas">6.7</td>
                <td class="notas">7.5</td>
            </tr>
            <tr>
                <td>Física</td>
                <td class="notas">9.1</td>
                <td class="notas">7.4</td>
                <td class="notas">8.2</td>
            </tr>
            <tr>
                <td>Química</td>
                <td class="notas">5.2</td>
                <td class="notas">6.8</td>
                <td class="notas">6.0</td>                
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="notas">7.9</td>
                <td class="notas">8.6</td>
                <td class="notas">8.2</td>
            </tr>
            <tr>
                <th scope="row" class="media" colspan="4n">Média de Exatas</th>
                <td class="media-final">7.5</td>
            </tr>
            <tr>
                <th scope="rowgroup" rowspan="2n">Humanas</th>
                <td>História</td>
                <td class="notas">6.4</td>
                <td class="notas">8.1</td>
                <td class="notas">7.2</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="notas">7.3</td>
                <td class="notas">6.9</td>
                <td class="notas">7.1</td>
            </tr>
            <tr>
                <th scope="row" class="media" colspan="4n">Média de Humanas</th>
                <td class="media-final">7.1</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
