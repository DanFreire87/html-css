<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        td, th {
            border: 1px solid black;
            padding: 8px;
        }

        col.cnome {
            background-color: lightcoral;
        }

        col.cgrupo {
            background-color: lightblue;
        }

        col.cprof {
            background-color: lightgreen;
        }


    </style>
</head>
<body>
    <h1>Exercício de Tabelas</h1>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="2">
            <col class="cprof">
        </colgroup>

        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Nilda</td>
            <td>F</td>
            <td>38</td>
            <td>Laboratorista</td>
        </tr>
        <tr>
            <td>Danilo</td>
            <td>M</td>
            <td>38</td>
            <td>Promotor de Vendas</td>
        </tr>
        <tr>
            <td>Bianca</td>
            <td>F</td>
            <td>11</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td>12</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>Darlan</td>
            <td>M</td>
            <td>35</td>
            <td>Padeiro</td>
        </tr>
    </table>
</body>
</html>
